name: Documentation issue
description: Report missing, unclear, inaccurate, or broken documentation
title: "[Docs] "
labels: []
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: File, section, or public URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is inaccurate, missing, unclear, or broken?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested correction
      description: Include the implementation or source that supports the correction when possible.
  - type: textarea
    id: audience
    attributes:
      label: Affected audience
      description: New users, operators, component developers, security reviewers, or release maintainers.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the latest default branch and searched for an existing documentation issue.
          required: true
        - label: The report contains no credentials, customer data, or private infrastructure details.
          required: true
