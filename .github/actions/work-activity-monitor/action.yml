name: Kuasar work activity monitor
description: Surface actionable GitHub reviews, decisions, deadlines, blockers, and follow-ups
inputs:
  token:
    description: GitHub token with issues:write access in the caller repository
    required: true
  recipient:
    description: GitHub login to mention and assign on alerts
    required: true
runs:
  using: composite
  steps:
    - name: Classify activity and publish an alert
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        MONITOR_RECIPIENT: ${{ inputs.recipient }}
      run: python3 "$GITHUB_ACTION_PATH/monitor.py"
